spring.application.name=fermabets
server.port=8080
spring.datasource.url=jdbc:sqlite:data/fermabets.db?busy_timeout=60000&journal_mode=WAL
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=4
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.thymeleaf.cache=false

# App settings (can be overridden in the UI Settings section where noted)
fermabets.db-path=data/fermabets.db
fermabets.ingest-dir=ingest
fermabets.python=
fermabets.bankroll=300
fermabets.kelly-fraction=0.25
fermabets.min-stake=5
fermabets.max-stake=0
fermabets.max-stake-pct=0.15
fermabets.min-ev=0.04
fermabets.market-weight=0.5

spring.web.locale=en_US
spring.web.locale-resolver=fixed
